# Configuració comuna de la web (inclosa pel servidor HTTP i, si s'activa, pel HTTPS)
root /usr/share/nginx/html;
index index.html;

# Fitxers de dades de les preguntes (el backend n'accepta fins a 10 MB)
client_max_body_size 12m;

# Capçaleres de seguretat per a tota la web
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: només recursos propis i cap connexió a fora (un script injectat no podria enviar el token
# enlloc amb fetch), i només scripts de l'aplicació (cap script en línia, ni a la pàgina ni a la
# previsualització de les respostes HTML dels alumnes, que es mostra amb l'iframe sense permís per
# executar scripts); imatges i estils https: per als exercicis HTML que enllacen recursos externs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; worker-src 'self' blob:; connect-src 'self'; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

location / {
    try_files $uri $uri/ /index.html;
}

# Límits de peticions per adreça (zones a nginx-limits.conf). 429 quan se superen.
limit_conn perip 100;

# Inici de sessió: molt més estricte que la resta de l'API
location = /api/auth/login {
    limit_req zone=login burst=50 nodelay;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
}

# Informes d'estat dels ordinadors de l'aula (n'envien un cada 15 minuts)
location = /api/equips/informe {
    limit_req zone=informes burst=10 nodelay;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
}

location /api/ {
    limit_req zone=api burst=200 nodelay;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Les capçaleres que envia el client no han d'arribar al backend
    proxy_set_header X-Forwarded-For "";
}

location /oauth2/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
}

location /login/oauth2/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
}
