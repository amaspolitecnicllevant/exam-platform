# Configuració comuna de la web (inclosa pel servidor HTTP i, si s'activa, pel HTTPS)
root /usr/share/nginx/html;
index index.html;

# Fitxers de dades de les preguntes (el backend n'accepta fins a 10 MB)
client_max_body_size 12m;

# Capçaleres de seguretat per a tota la web
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP: només recursos propis i cap connexió a fora (un script injectat no podria enviar el token
# enlloc amb fetch). 'unsafe-inline' als scripts cal perquè la previsualització de les respostes
# HTML dels alumnes (iframe srcdoc aïllat) hereta aquesta política; imatges i estils https: per
# als exercicis HTML que enllacen recursos externs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; worker-src 'self' blob:; connect-src 'self'; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

location / {
    try_files $uri $uri/ /index.html;
}

location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Les capçaleres que envia el client no han d'arribar al backend
    proxy_set_header X-Forwarded-For "";
}

location /oauth2/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
}

location /login/oauth2/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
}
