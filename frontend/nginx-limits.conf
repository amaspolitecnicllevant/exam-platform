# Límits de peticions per adreça (zones). Es carrega abans que default.conf (00-) tant en HTTP com en HTTPS.
# Un ordinador normal no se n'apropa: l'autodesat d'un examen són 1-2 peticions per segon i carregar la pàgina,
# unes quantes desenes d'un cop. Els límits tallen només qui bombardeja el servidor (un script, un error).
#
# Si molts usuaris surten amb LA MATEIXA adreça (una xarxa amb NAT o un proxy), compten tots com un de sol:
# en aquest cas cal pujar el «rate» de la zona «api» (i el «burst» de sedex.conf), o no es poden fer servir.

limit_req_zone  $binary_remote_addr zone=api:10m      rate=60r/s;   # tota l'API
limit_req_zone  $binary_remote_addr zone=login:10m    rate=5r/s;    # inici de sessió
limit_req_zone  $binary_remote_addr zone=informes:1m  rate=2r/s;    # informes d'estat dels ordinadors de l'aula
limit_conn_zone $binary_remote_addr zone=perip:10m;                 # peticions simultànies

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;
